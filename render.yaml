# Render Blueprint for hosting all 11 microservices separately
# Render documentation: https://render.com/docs/blueprint-spec

services:
  # -------------------------------------------------------------
  # MANAGED REDIS INSTANCE
  # -------------------------------------------------------------
  - type: redis
    name: tridop-redis
    ipAllowList: [] # internal access only

  # -------------------------------------------------------------
  # 1. API GATEWAY (Publicly Accessible Entry Point)
  # -------------------------------------------------------------
  - type: web
    name: tridop-api-gateway
    env: docker
    dockerfilePath: apps/api-gateway/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "4000"
      - key: NODE_ENV
        value: production
      - key: REDIS_URL
        fromService:
          type: redis
          name: tridop-redis
          property: connectionString

  # -------------------------------------------------------------
  # 2. IDENTITY SERVICE
  # -------------------------------------------------------------
  - type: web
    name: tridop-identity-service
    env: docker
    dockerfilePath: apps/identity-service/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "3000"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: tridop-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: tridop-redis
          property: connectionString

  # -------------------------------------------------------------
