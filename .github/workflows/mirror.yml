name: Mirror Repository

on:
  push:
    branches: ["*"]
    tags: ["*"]
  workflow_dispatch:

jobs:
  mirror-to-personal:
    name: Sync Organization Repo to Personal Repo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Mirror to Personal and Secondary Repositories
        env:
          PAT_TOKEN_1: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          TARGET_REPO_URL_1: ${{ secrets.PERSONAL_REPO_URL }}
          PAT_TOKEN_2: ${{ secrets.SECOND_ACCESS_TOKEN }}
          TARGET_REPO_URL_2: ${{ secrets.SECOND_REPO_URL }}
          PAT_TOKEN_3: ${{ secrets.THIRD_ACCESS_TOKEN }}
          TARGET_REPO_URL_3: ${{ secrets.THIRD_REPO_URL }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Function to handle pushing to a target
          sync_target() {
            local NAME="$1"
            local TOKEN="$2"
            local REPO_URL="$3"

            if [ -z "$REPO_URL" ] || [ -z "$TOKEN" ]; then
              echo "Skipping $NAME: Secrets not configured."
              return 0
            fi

            echo "::add-mask::$TOKEN"

            # Strip existing auth user prefix if present and inject PAT with x-access-token
            CLEAN_URL=$(echo "$REPO_URL" | sed -E 's#https://([^@]+@)?#https://#')
            AUTHENTICATED_URL=$(echo "$CLEAN_URL" | sed -E "s#https://#https://x-access-token:${TOKEN}@#")

            git remote add "$NAME" "$AUTHENTICATED_URL" 2>/dev/null || git remote set-url "$NAME" "$AUTHENTICATED_URL"

            echo "Pushing all branches and tags to $NAME..."
            git push --prune "$NAME" "+refs/heads/*:refs/heads/*" "+refs/tags/*:refs/tags/*"
          }

          # Mirror to Primary / Personal
          sync_target "mirror-primary" "$PAT_TOKEN_1" "$TARGET_REPO_URL_1"

          # Mirror to Secondary
          sync_target "mirror-secondary" "$PAT_TOKEN_2" "$TARGET_REPO_URL_2"

