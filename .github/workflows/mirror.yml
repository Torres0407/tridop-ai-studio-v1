name: Mirror Repository

on:
  push:
    branches: ["*"]
    tags: ["*"]
  workflow_dispatch:

jobs:
  mirror-to-personal:
    name: Sync Organization Repo to Personal Repo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Mirror to Personal Repository
        env:
          PAT_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          TARGET_REPO_URL: ${{ secrets.PERSONAL_REPO_URL }}
        run: |
          if [ -z "$TARGET_REPO_URL" ] || [ -z "$PAT_TOKEN" ]; then
            echo "Skipping mirror step: PERSONAL_REPO_URL or PERSONAL_ACCESS_TOKEN secret is not configured."
            exit 0
          fi

          echo "::add-mask::$PAT_TOKEN"

          # Strip existing auth user prefix if present and inject PAT with x-access-token
          CLEAN_URL=$(echo "$TARGET_REPO_URL" | sed -E 's#https://([^@]+@)?#https://#')
          AUTHENTICATED_URL=$(echo "$CLEAN_URL" | sed -E "s#https://#https://x-access-token:${PAT_TOKEN}@#")

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git remote add mirror "$AUTHENTICATED_URL" 2>/dev/null || git remote set-url mirror "$AUTHENTICATED_URL"

          echo "Pushing all branches and tags to personal repository..."
          git push --prune mirror "+refs/heads/*:refs/heads/*" "+refs/tags/*:refs/tags/*"

