name: E2E

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    name: Integration Tests (full mesh)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --ignore-scripts --legacy-peer-deps --no-audit

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL

      - name: Build services sequentially to prevent OOM
        run: |
          services="identity-service api-gateway sites-service ai-service deploy-service domains-service commerce-service billing-service engagement-service analytics-service owner-service"
          for svc in $services; do
            echo "Building $svc..."
            docker compose build $svc
          done

      - name: Start docker-compose stack
        run: docker compose up -d --wait
        timeout-minutes: 20

      - name: Run integration tests
        run: npx nx run-many --target=test:e2e --all --parallel=1
        env:
          NODE_ENV: test
          REDIS_URL: redis://localhost:6379
          # Each service uses its own DATABASE_URL / MONGODB_URI from
          # docker-compose environment — see docker-compose.yml

      - name: Tear down stack
        if: always()
        run: docker compose down -v
