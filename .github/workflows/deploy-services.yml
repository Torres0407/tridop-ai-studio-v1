name: Deploy Services

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        service:
          - identity-service
          - api-gateway
          - sites-service
          - ai-service
          - deploy-service
          - domains-service
          - commerce-service
          - billing-service
          - engagement-service
          - analytics-service
          - owner-service

    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          push: true
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/tridopai-${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/tridopai-${{ matrix.service }}:latest

      - name: Trigger Render Deployment (Optional)
        run: |
          # Transform matrix service name to uppercase with underscores (e.g., SITES_SERVICE_RENDER_HOOK)
          HOOK_VAR_NAME="$(echo "${{ matrix.service }}" | tr '[:lower:]-' '[:upper:]_')_RENDER_HOOK"
          RENDER_HOOK_URL="${!HOOK_VAR_NAME}"
          if [ -n "$RENDER_HOOK_URL" ]; then
            echo "Triggering Render deployment for ${{ matrix.service }}..."
            curl -s -X POST "$RENDER_HOOK_URL"
          else
            echo "No Render Deploy Hook configured for $HOOK_VAR_NAME, skipping automated webhook trigger."
          fi

      - name: Deploy service
        run: |
          echo "Deploying ${{ matrix.service }}:${{ github.sha }}"
          # e.g.: flyctl deploy --image ghcr.io/... --app tridopai-${{ matrix.service }}

      - name: Health check
        run: |
          SERVICE_URL=${{ secrets[format('{0}_HEALTH_URL', matrix.service)] }}
          if [ -z "$SERVICE_URL" ]; then
            echo "No health URL configured for ${{ matrix.service }}, skipping."
            exit 0
          fi
          for i in {1..12}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$SERVICE_URL/health")
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt $i failed (status $STATUS), retrying in 10s..."
            sleep 10
          done
          echo "Health check failed after 12 attempts"
          exit 1

      - name: Rollback on failure
        if: failure()
        run: |
          echo "Rolling back ${{ matrix.service }} to previous image..."
          # e.g.: flyctl deploy --image ghcr.io/...:<previous-sha> --app tridopai-${{ matrix.service }}
