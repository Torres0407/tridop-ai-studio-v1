name: Deploy Services

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  verify:
    name: 🛡️ Verify All Microservices Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit

      - name: Build all microservices
        run: npx nx run-many --target=build --all --parallel=3

  build-and-push:
    name: 🚀 Build & Push Docker Image
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        service:
          - identity-service
          - api-gateway
          - sites-service
          - ai-service
          - deploy-service
          - domains-service
          - commerce-service
          - billing-service
          - engagement-service
          - analytics-service
          - owner-service

    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Lowercase Repository Owner
        id: repo
        run: echo "owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          push: true
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          tags: |
            ghcr.io/${{ steps.repo.outputs.owner }}/tridopai-${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ steps.repo.outputs.owner }}/tridopai-${{ matrix.service }}:latest

      - name: Trigger Render Deployment (Optional)
        shell: bash
        run: |
          HOOK_VAR_NAME="$(echo "${{ matrix.service }}" | tr '[:lower:]-' '[:upper:]_')_RENDER_HOOK"
          RENDER_HOOK_URL="${!HOOK_VAR_NAME}"
          if [ -n "$RENDER_HOOK_URL" ]; then
            echo "Triggering Render deployment for ${{ matrix.service }}..."
            curl -s -X POST "$RENDER_HOOK_URL"
          else
            echo "No Render Deploy Hook configured for $HOOK_VAR_NAME, skipping automated webhook trigger."
          fi
